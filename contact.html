<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Steve Wort Photography</title>
  <meta name="description" content="Get in touch with Steve Wort Photography.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header" class="site-header"></header>

  <main>
    <h2>Contact</h2>
    <p>
      Interested in working together? Get in touch using the details below
      or send a message using the form.
    </p>

    <dl class="contact-details">
      <dt>Email</dt>
      <dd><a href="mailto:hello@stevewortphotography.com">hello@stevewortphotography.com</a></dd>
      <dt>Phone</dt>
      <dd>+44 (0)1234 567890</dd>
      <dt>Based in</dt>
      <dd>United Kingdom &middot; available worldwide</dd>
    </dl>

    <form class="contact-form" action="mailto:hello@stevewortphotography.com" method="post" enctype="text/plain">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/components.js"></script>
</body>
</html>
